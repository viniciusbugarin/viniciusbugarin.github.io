<style>

/* =========================================
   RESET
========================================= */

*,
*::before,
*::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}

/* =========================================
   ROOT
========================================= */

:root {

--bg-main: #020617;
--bg-secondary: #0f172a;

--primary: #3b82f6;
--primary-light: #60a5fa;

--text-main: #ffffff;
--text-secondary: #94a3b8;

--border: rgba(255,255,255,.08);

--gradient:
linear-gradient(
135deg,
#60a5fa,
#22c55e
);

--transition:
.35s cubic-bezier(.4,0,.2,1);

--shadow:
0 20px 60px rgba(0,0,0,.35);
}

/* =========================================
   BODY
========================================= */

body {

min-height: 100vh;

display: flex;

align-items: center;

justify-content: center;

padding: 40px;

overflow: hidden;

font-family: 'Inter', sans-serif;

background:
radial-gradient(circle at top, rgba(59,130,246,.14), transparent 40%),
var(--bg-main);

color: var(--text-main);

position: relative;
}

/* =========================================
   BACKGROUND GRID
========================================= */

body::before {

content: "";

position: fixed;

inset: 0;

background:
linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);

background-size: 60px 60px;

opacity: .35;

pointer-events: none;

z-index: -2;
}

/* =========================================
   GLOW
========================================= */

.glow {

position: absolute;

width: 700px;
height: 700px;

background:
radial-gradient(
circle,
rgba(59,130,246,.22),
transparent 70%
);

filter: blur(100px);

opacity: .7;

animation:
floatGlow 8s ease-in-out infinite;

z-index: -1;
}

/* =========================================
   CARD
========================================= */

.error-card {

width: 100%;
max-width: 900px;

padding: 70px 50px;

text-align: center;

border-radius: 32px;

background:
rgba(15,23,42,.72);

border:
1px solid rgba(255,255,255,.08);

backdrop-filter: blur(18px);

box-shadow: var(--shadow);

position: relative;

overflow: hidden;
}

.error-card::before {

content: "";

position: absolute;

inset: 0;

background:
linear-gradient(
135deg,
rgba(255,255,255,.04),
transparent
);

pointer-events: none;
}

/* =========================================
   TYPOGRAPHY
========================================= */

.error-code {

font-size:
clamp(110px, 16vw, 220px);

font-weight: 900;

line-height: .9;

letter-spacing: -8px;

margin-bottom: 24px;

background:
linear-gradient(
90deg,
#ffffff,
#60a5fa
);

-webkit-background-clip: text;

-webkit-text-fill-color: transparent;
}

h1 {

font-size:
clamp(34px, 5vw, 58px);

font-weight: 800;

line-height: 1.1;

margin-bottom: 24px;
}

p {

font-size: 20px;

line-height: 1.8;

color: var(--text-secondary);

max-width: 700px;

margin:
0 auto 50px;
}

/* =========================================
   BUTTONS
========================================= */

.buttons {

display: flex;

justify-content: center;

gap: 18px;

flex-wrap: wrap;
}

.btn {

display: inline-flex;

align-items: center;

justify-content: center;

padding: 18px 34px;

border-radius: 999px;

font-size: 15px;

font-weight: 700;

transition: var(--transition);

text-decoration: none;
}

.btn.primary {

background: var(--gradient);

color: white;

box-shadow:
0 12px 40px rgba(59,130,246,.25);
}

.btn.primary:hover {

transform:
translateY(-4px);

box-shadow:
0 18px 50px rgba(59,130,246,.35);
}

.btn.secondary {

background:
rgba(255,255,255,.03);

border:
1px solid rgba(255,255,255,.08);

color: white;
}

.btn.secondary:hover {

background:
rgba(255,255,255,.06);

transform:
translateY(-3px);
}

/* =========================================
   QUICK LINKS
========================================= */

.quick-links {

margin-top: 70px;

display: flex;

justify-content: center;

gap: 18px;

flex-wrap: wrap;
}

.quick-links a {

padding: 12px 20px;

border-radius: 999px;

background:
rgba(255,255,255,.03);

border:
1px solid rgba(255,255,255,.06);

color: var(--text-secondary);

font-size: 14px;

font-weight: 600;

transition: var(--transition);
}

.quick-links a:hover {

background:
rgba(255,255,255,.06);

color: white;

transform:
translateY(-2px);
}

/* =========================================
   ANIMATIONS
========================================= */

@keyframes floatGlow {

0%,100% {
transform: translateY(0);
}

50% {
transform: translateY(-40px);
}
}

/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 768px) {

.error-card {

padding: 60px 28px;
}

.buttons {

flex-direction: column;
}

.btn {

width: 100%;
}

p {

font-size: 18px;
}
}

</style>

</head>

  </div>

  </div>

</main>

</body>
